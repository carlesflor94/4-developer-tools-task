<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title-1">Get iintoo today</h1>
        <p class="subtitle-1">There is no charge or obligation upon registration</p>

        <form action="https://habsida.com/#open" class="login"></form>

        <input type="submit" class="facebook" value="Register with Facebook">
        <input type="submit" class="linkedin" value="Register with LinkedIn">

        <p class="subtitle-2">OR</p>

        
        <label for="email">Email</label>
        <input type="text" id="email" name="email">

        <label for="phone">Phone</label>
        <input type="number" id="phone" name="phone">

        <h2 class="title-2">What type of investor are you?</h2>
        <p class="subtitle-2">Select the type of investor you are below</p>

        <div class="checkbox-container">
            <input type="checkbox" id="individual">
            <label for="individual">Individual</label>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="business">
            <label for="business">Business</label>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="ira">
            <label for="ira">IRA</label>
        </div>

         <div class="checkbox-container">
            <input type="checkbox" id="trust">
            <label for="trust">Trust</label>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="trust">
            <label for="trust">Trust</label>
        </div>


        <div class="checkbox-container-2">
            <input type="checkbox" id="agree">
            <label for="agree">I agree to the terms and receiving notifications from iintoo <a href="https://habsida.com">View full terms</a></label>
        </div>


        <input type="submit" value="Create Account">
        </form>

    </div>
</body>
</html>
