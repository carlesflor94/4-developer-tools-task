<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrapper flex">
    <div class="container flex">
        <div class="card-col iintoo-img">
                <div class="picture">
                    <img class="img1" src="img/logo.svg" alt="" width="80" height="40">
                    <img class="img2" src="img/bg.jpg" alt="">
                </div>
        </div>
    

        <div class="card-col form-text">
    
            <h1 class="title-1">Get iintoo it today</h1>
            <p class="subtitle-1">There is no charge or obligation upon registration</p>

            <form action="https://habsida.com/#open" class="login"></form>

            <div class="register flex">

            <button class="facebook"><img src="img/facebook.svg" width="16" height="16">Register with Facebook</button>
            <input type="submit" class="linkedin" value="Register with LinkedIn">
            
            </div>

            <p class="subtitle-2">OR</p>

            <div class="email-phone flex">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">
            </div>
            <h2 class="title-2">What type of investor are you?</h2>
            <p class="subtitle-2">Select the type of investor you are below</p>

            <div class="checkbox-container flex">
                <label>
                    <input type="radio" id="individual" name="radio">Individual
                    <span class="checkmark"></span>
                </label>

                <label>
                    <input type="radio" id="business" name="radio">
                    <span class="checkmark">Business</span>
                </label>

                <label>
                    <input type="radio" id="ira" name="radio">
                    <span class="checkmark">IRA</span>
                </label>

                <label>
                    <input type="radio" id="trust" name="radio">
                    <span class="checkmark">Trust</span>
                </label>

            </div>



            <div class="checkbox-container-2">
            <input type="checkbox" id="agree">
            <label for="agree">I agree to the terms and receiving notifications from iintoo <a href="https://habsida.com">View full terms</a></label>
            </div>

             <input type="submit" class="create-account" value="Create Account">
            </form>

        </div>

        

    </div>
    </main>
</body>
</html>
